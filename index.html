const tabs=h("div",{className:"tabs"});
[{id:"plan",l:"📅 Haftalık Plan"},{id:"subjects",l:"📖 Dersler"},{id:"resources",l:"🔗 Kaynaklar"}].forEach(t=>{tabs.append(h("button",{className:"tab-btn"+(state.tab===t.id?" active":""),onClick:()=>{state.tab=t.id;render()}},t.l))});
app.append(tabs);
if(state.tab==="plan")renderPlan(app,cw);else if(state.tab==="subjects")renderSubjects(app);else renderResources(app);
app.append(h("div",{className:"footer"},"SPL Düzey 1 Hazırlık Dashboard · Ders ders sınav stratejisi"))}

function renderPlan(app,cw){
const grid=h("div",{className:"week-grid"});
WEEKS.forEach((w,i)=>{const pr=weekProg(i);const isActive=state.selWeek===i;
const pill=h("div",{className:"week-pill"+(isActive?" active":""),style:{borderColor:isActive?w.color:"",background:isActive?w.color+"18":""},onClick:()=>{state.selWeek=i;render()}});
const numEl=h("span",{className:"week-pill__num",style:{color:isActive?w.color:"var(--text-muted)"}});
if(w.examWeek){numEl.style.fontSize="9px";numEl.textContent="📝"}else{numEl.textContent=String(i+1)}
const barEl=h("div",{className:"week-pill__bar",style:{background:pr===100?"var(--green)":pr>0?w.color:"rgba(255,255,255,0.06)",opacity:pr===100?"1":pr>0?"0.6":"0.3"}});
pill.append(numEl,barEl);grid.append(pill)});
app.append(grid);
const card=h("div",{className:"card card--accent",style:{"--accent":cw.color,borderLeftColor:cw.color}});
if(cw.examWeek){const badge=h("div",{className:"exam-badge",style:{background:cw.color+"20",color:cw.color,border:"1px solid "+cw.color+"44"}});badge.append(h("span",null,"🎯"),h("span",null,"SINAV HAFTASI"));card.append(badge)}
const head=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}});
const left=h("div",null,h("div",{style:{fontSize:"11px",fontWeight:700,letterSpacing:"2px",color:cw.color,textTransform:"uppercase",marginBottom:"4px"}},"BLOK "+cw.block+" · HAFTA "+cw.week+" — "+cw.phase),h("h2",{style:{fontSize:"22px",fontWeight:700,color:"var(--text-primary)"}},cw.subject));
head.append(left,h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:"24px",fontWeight:700,color:cw.color}},"%"+weekProg(state.selWeek)));
card.append(head);
const badges=h("div",{className:"time-badges"});
badges.append(h("div",{className:"time-badge",innerHTML:"🕐 Hafta içi: günde <strong>"+cw.dailyH+" saat</strong>"}),h("div",{className:"time-badge",innerHTML:"📅 Hafta sonu: toplamda <strong>"+cw.weekendH+" saat</strong>"}));
card.append(badges);
const wi=state.selWeek;
cw.topics.forEach((t,ti)=>{const done=!!state.done[wi+"-"+ti];
const btn=h("div",{className:"topic-btn"+(done?" done":""),style:{background:done?cw.color+"10":"",borderColor:done?cw.color+"33":""},onClick:()=>toggleTopic(wi,ti)});
btn.append(h("div",{className:"topic-btn__check",style:{background:done?cw.color:"transparent"}},done?"✓":""),h("span",{className:"topic-btn__text"},t));
card.append(btn)});
const tip=h("div",{className:"tip-box",style:{background:cw.color+"0A",border:"1px solid "+cw.color+"22"}});
tip.append(h("span",{style:{fontSize:"16px",flexShrink:0,marginTop:"1px"}},"💡"),h("span",{innerHTML:"<strong style='color:"+cw.color+"'>İpucu:</strong> "+cw.tip}));
card.append(tip);app.append(card)}

function renderSubjects(app){
SUBJECTS.forEach(s=>{const card=h("div",{className:"card card--accent subj-card",style:{"--accent":s.color,borderLeftColor:s.color}});
const head=h("div",{className:"subj-card__head"});
head.append(h("span",{className:"subj-card__icon"},s.icon),h("div",null,h("div",{className:"subj-card__name"},s.order+". "+s.name),h("div",{className:"subj-card__meta"},s.q+" soru · Hafta "+s.weeks+" · Minimum 50 puan")));
card.append(head);const tg=h("div",{className:"subj-topics"});s.subs.forEach(t=>tg.append(h("div",{className:"subj-topic"},"• "+t)));card.append(tg);app.append(card)});
const tc=h("div",{className:"card",style:{background:"linear-gradient(135deg, rgba(78,130,200,0.08), rgba(22,27,34,0.95))",border:"1px solid rgba(78,130,200,0.15)"}});
tc.append(h("h3",{style:{fontSize:"16px",fontWeight:700,color:"var(--text-primary)",marginBottom:"14px"}},"🗓️ Sınav Takvimi"));
[{w:"Hafta 3",s:"Takas/Saklama Sınavı",c:"#D95B6A"},{w:"Hafta 6",s:"Yatırım Kuruluşları Sınavı",c:"#6ABF69"},{w:"Hafta 9",s:"SP Araçları 1 Sınavı",c:"#4A9BD9"},{w:"Hafta 12",s:"Mevzuat Sınavı (Son!)",c:"#E8A838"}].forEach(e=>{
tc.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"10px 12px",background:"rgba(255,255,255,0.02)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid "+e.c}},
h("span",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:"12px",fontWeight:700,color:e.c,minWidth:"60px"}},e.w),h("span",{style:{fontSize:"13px",color:"var(--text-secondary)"}},e.s)))});
app.append(tc);
const rc=h("div",{className:"card",style:{background:"linear-gradient(135deg, rgba(78,130,200,0.1), rgba(22,27,34,0.95))",border:"1px solid rgba(78,130,200,0.2)"}});
rc.append(h("h3",{style:{fontSize:"16px",fontWeight:700,color:"var(--text-primary)",marginBottom:"14px"}},"📋 Sınav Kuralları Özet"));
const rg=h("div",{className:"rules-grid"});RULES.forEach(r=>{rg.append(h("div",{className:"rule-box"},h("div",{className:"rule-box__label"},r.l),h("div",{className:"rule-box__val"},r.v)))});
rc.append(rg);app.append(rc)}

function renderResources(app){
RESOURCES.forEach(r=>{const row=h("div",{className:"res-row"});row.append(h("div",null,h("div",{className:"res-row__name"},r.name),h("div",{className:"res-row__url"},r.url)),h("span",{className:"res-badge",style:{background:r.c+"22",color:r.c}},r.type));app.append(row)});
const sc=h("div",{className:"card",style:{border:"1px solid rgba(232,168,56,0.15)"}});
sc.append(h("h3",{style:{fontSize:"16px",fontWeight:700,color:"var(--text-primary)",marginBottom:"14px"}},"🎯 Ders Ders Sınav Stratejisi"));
STEPS.forEach((s,i)=>{sc.append(h("div",{className:"step-row"},h("span",{className:"step-num"},String(i+1)),h("span",{className:"step-text"},s)))});
app.append(sc)}

loadProgress();render();
</script>
</body>
