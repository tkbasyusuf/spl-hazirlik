<link rel="manifest" href="manifest.json">

<style>
  :root {
    --bg-primary: #0D1117;
    --bg-secondary: #161B22;
    --bg-card: rgba(30,38,50,0.92);
    --border-subtle: rgba(255,255,255,0.06);
    --text-primary: #F0F6FC;
    --text-secondary: #C9D1D9;
    --text-muted: #8B949E;
    --text-dim: #484F58;
    --gold: #E8A838;
    --blue: #4A9BD9;
    --green: #6ABF69;
    --red: #D95B6A;
    --purple: #9B6FD9;
    --orange: #E86A3A;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
    color: var(--text-secondary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ambient glows */
  body::before, body::after {
    content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0;
  }
  body::before {
    top:-200px; right:-200px; width:600px; height:600px;
    background: radial-gradient(circle, rgba(78,130,200,0.08) 0%, transparent 70%);
  }
  body::after {
    bottom:-200px; left:-100px; width:500px; height:500px;
    background: radial-gradient(circle, rgba(232,168,56,0.06) 0%, transparent 70%);
  }

  .shell { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:24px 16px; }

  /* HEADER */
  .header { text-align:center; margin-bottom:32px; animation: slideDown 0.6s cubic-bezier(.16,1,.3,1) both; }
  .header__badge {
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
    background: linear-gradient(135deg, var(--gold), var(--red));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .header h1 {
    font-size: clamp(26px,5vw,42px); font-weight:700; color:var(--text-primary);
    letter-spacing:-1px; line-height:1.1; margin-bottom:6px;
  }
  .header p { font-size:14px; color:var(--text-muted); }

  /* CARD */
  .card {
    background: linear-gradient(135deg, var(--bg-card), rgba(22,27,34,0.95));
    border:1px solid var(--border-subtle); border-radius:16px; padding:22px;
    backdrop-filter:blur(10px); margin-bottom:20px;
    animation: fadeUp 0.55s cubic-bezier(.16,1,.3,1) both;
  }
  .card--accent { border-left:4px solid var(--accent, var(--blue)); }

  /* PROGRESS BAR */
  .prog-track { width:100%; height:8px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; }
  .prog-fill  { height:100%; border-radius:4px; transition: width .8s cubic-bezier(.16,1,.3,1); }
  .prog-fill--rainbow { background: linear-gradient(90deg, var(--gold), var(--green), var(--blue)); }

  /* PHASE GRID */
  .phases { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
  .phase-box {
    background:rgba(255,255,255,0.03); border-radius:10px; padding:12px 10px;
    text-align:center; border:1px solid transparent;
  }
  .phase-box__icon { font-size:20px; margin-bottom:2px; }
  .phase-box__label { font-size:11px; color:var(--text-muted); font-weight:500; margin-bottom:4px; }
  .phase-box__val { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; }

  /* TABS */
  .tabs {
    display:flex; gap:4px; margin-bottom:18px;
    background:rgba(255,255,255,0.03); border-radius:10px; padding:4px;
    border:1px solid var(--border-subtle);
  }
  .tab-btn {
    flex:1; padding:10px 6px; border:none; border-radius:8px; cursor:pointer;
    font-size:13px; font-weight:600; font-family:inherit;
    background:transparent; color:var(--text-muted); transition:all .2s;
  }
  .tab-btn.active { background:rgba(78,130,200,0.15); color:var(--text-primary); }

  /* WEEK SELECTOR */
  .week-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; margin-bottom:18px; }
  .week-pill {
    border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02);
    border-radius:8px; padding:8px 2px; cursor:pointer; text-align:center; transition:all .2s;
  }
  .week-pill.active { border-width:2px; }
  .week-pill__num { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; display:block; }
  .week-pill__bar { width:100%; height:3px; border-radius:2px; margin-top:3px; }

  /* TOPIC LIST */
  .topic-btn {
    display:flex; align-items:center; gap:12px; width:100%;
    background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05);
    border-radius:10px; padding:12px 14px; cursor:pointer; text-align:left;
    transition:all .2s; margin-bottom:6px; font-family:inherit;
  }
  .topic-btn.done { border-color: rgba(255,255,255,0.08); }
  .topic-btn__check {
    width:22px; height:22px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.15); font-size:13px; font-weight:700;
    color:var(--bg-primary); transition:all .2s;
  }
  .topic-btn.done .topic-btn__check { border:none; }
  .topic-btn__text { font-size:14px; font-weight:500; line-height:1.4; color:var(--text-secondary); transition:all .2s; }
  .topic-btn.done .topic-btn__text { color:var(--text-muted); text-decoration:line-through; }

  /* TIP BOX */
  .tip-box {
    border-radius:10px; padding:14px 16px; display:flex; gap:10px; align-items:flex-start;
    margin-top:16px;
  }
  .tip-box span { font-size:13px; line-height:1.5; color:var(--text-secondary); }

  /* SUBJECT CARD (Dersler tab) */
  .subj-card { margin-bottom:12px; }
  .subj-card__head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .subj-card__icon { font-size:24px; }
  .subj-card__name { font-size:16px; font-weight:700; color:var(--text-primary); }
  .subj-card__meta { font-size:12px; color:var(--text-muted); }
  .subj-topics { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .subj-topic {
    font-size:12px; color:var(--text-muted); padding:6px 10px;
    background:rgba(255,255,255,0.03); border-radius:6px;
  }

  /* EXAM RULES */
  .rules-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .rule-box { background:rgba(255,255,255,0.04); border-radius:8px; padding:10px 12px; }
  .rule-box__label { font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .rule-box__val { font-size:14px; font-weight:700; color:var(--text-primary); font-family:'JetBrains Mono',monospace; }

  /* RESOURCE */
  .res-row {
    display:flex; justify-content:space-between; align-items:center;
    background: linear-gradient(135deg, var(--bg-card), rgba(22,27,34,0.95));
    border:1px solid var(--border-subtle); border-radius:12px; padding:14px 18px;
    margin-bottom:10px;
  }
  .res-row__name { font-size:15px; font-weight:600; color:var(--text-primary); }
  .res-row__url  { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .res-badge {
    font-size:11px; font-weight:700; letter-spacing:1px; padding:4px 10px;
    border-radius:20px; white-space:nowrap;
  }

  /* STRATEGY STEPS */
  .step-row { display:flex; align-items:flex-start; gap:12px; padding:10px 12px; background:rgba(255,255,255,0.02); border-radius:8px; margin-bottom:8px; }
  .step-num {
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(135deg, var(--gold), var(--red));
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--bg-primary);
  }
  .step-text { font-size:13px; color:var(--text-secondary); line-height:1.5; }

  /* TIME BADGES */
  .time-badges { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .time-badge {
    background:rgba(255,255,255,0.04); border-radius:8px; padding:8px 14px;
    font-size:12px; color:var(--text-muted);
  }
  .time-badge strong { color:var(--text-secondary); }

  .footer { text-align:center; margin-top:32px; padding-bottom:20px; font-size:12px; color:var(--text-dim); }

  /* ANIMATIONS */
  @keyframes slideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  /* Responsive */
  @media (max-width:520px) {
    .week-grid { grid-template-columns: repeat(6,1fr); }
    .subj-topics { grid-template-columns:1fr; }
    .phases { grid-template-columns:repeat(3,1fr); gap:6px; }
    .rules-grid { grid-template-columns:1fr 1fr; }
  }
</style>
</head>

// ─── STATE ─────────────────────────────────────────────
let state = { selWeek:0, tab:"plan", done:{} };

function loadProgress() {
  try { const s = localStorage.getItem("spl_progress"); if(s) state.done = JSON.parse(s); } catch(e){}
}
function saveProgress() {
  try { localStorage.setItem("spl_progress", JSON.stringify(state.done)); } catch(e){}
}

function toggleTopic(wi, ti) {
  const k = wi+"-"+ti;
  state.done[k] = !state.done[k];
  if(!state.done[k]) delete state.done[k];
  saveProgress(); render();
}

function weekProg(wi) {
  const t = WEEKS[wi].topics.length; let d=0;
  for(let i=0;i<t;i++) if(state.done[wi+"-"+i]) d++;
  return Math.round(d/t*100);
}

function overallProg() {
  let t=0,d=0;
  WEEKS.forEach((w,wi) => { w.topics.forEach((_,ti) => { t++; if(state.done[wi+"-"+ti]) d++; }); });
  return t ? Math.round(d/t*100) : 0;
}

function phaseProg(phase) {
  let t=0,d=0;
  WEEKS.forEach((w,wi) => { if(w.phase===phase) w.topics.forEach((_,ti) => { t++; if(state.done[wi+"-"+ti]) d++; }); });
  return t ? Math.round(d/t*100) : 0;
}

// ─── RENDER ────────────────────────────────────────────
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => {
    if(k==="style"&&typeof v==="object") Object.assign(el.style, v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==="className") el.className = v;
    else if(k==="innerHTML") el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  kids.flat(Infinity).forEach(c => { if(c!=null) el.append(typeof c==="string" ? document.createTextNode(c) : c); });
  return el;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const ov = overallProg();
  const cw = WEEKS[state.selWeek];

  // ── HEADER
  app.append(h("div",{className:"header"},
    h("div",{className:"header__badge", innerHTML:"SERMAYE PİYASASI LİSANSLAMA"}),
    h("h1",null,"SPL Düzey 1 — Hazırlık Planı"),
    h("p",null,"12 Hafta · 4 Ders · 100 Soru · Hedef: Her ders ≥50, Ortalama ≥60")
  ));

  // ── OVERALL PROGRESS
  const progCard = h("div",{className:"card", style:{animationDelay:"0.1s"}});
  const progHead = h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}});
  progHead.append(
    h("span",{style:{fontSize:"13px",fontWeight:600,color:"var(--text-muted)",letterSpacing:"1px",textTransform:"uppercase"}},"Genel İlerleme"),
    h("span",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:"28px",fontWeight:700,
      background: ov>=80?"linear-gradient(135deg,#6ABF69,#4AE04A)":ov>=50?"linear-gradient(135deg,#E8A838,#F0C060)":"linear-gradient(135deg,#C9D1D9,#8B949E)",
      WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},`%${ov}`)
  );
  progCard.append(progHead);

  const track = h("div",{className:"prog-track"});
  track.append(h("div",{className:"prog-fill prog-fill--rainbow",style:{width:ov+"%"}}));
  progCard.append(track);

  // phases
  const phases = h("div",{className:"phases"});
  [{l:"Temel Öğrenme",p:"TEMEL ÖĞRENME",i:"📚",c:"var(--gold)"},{l:"Derinleşme",p:"DERİNLEŞME",i:"🔬",c:"var(--green)"},{l:"Sınav Provası",p:"SINAV PROVASI",i:"🎯",c:"var(--red)"}].forEach(ph => {
    const pp = phaseProg(ph.p);
    phases.append(h("div",{className:"phase-box",style:{borderColor:ph.c+"33"}},
      h("div",{className:"phase-box__icon"},ph.i),
      h("div",{className:"phase-box__label"},ph.l),
      h("div",{className:"phase-box__val",style:{color:ph.c}},`%${pp}`)
    ));
  });
  progCard.append(phases);
  app.append(progCard);

  // ── TABS
  const tabs = h("div",{className:"tabs"});
  [{id:"plan",l:"📅 Haftalık Plan"},{id:"subjects",l:"📖 Dersler"},{id:"resources",l:"🔗 Kaynaklar"}].forEach(t => {
    const btn = h("button",{className:"tab-btn"+(state.tab===t.id?" active":""), onClick:()=>{state.tab=t.id;render();}},t.l);
    tabs.append(btn);
  });
  app.append(tabs);

  // ── TAB CONTENT
  if(state.tab==="plan") renderPlan(app, cw);
  else if(state.tab==="subjects") renderSubjects(app);
  else renderResources(app);

  app.append(h("div",{className:"footer"},"SPL Düzey 1 Hazırlık Dashboard · Konuları tamamladıkça işaretle"));
}

function renderPlan(app, cw) {
  // week selector
  const grid = h("div",{className:"week-grid"});
  WEEKS.forEach((w,i) => {
    const pr = weekProg(i);
    const isActive = state.selWeek===i;
    const pill = h("div",{className:"week-pill"+(isActive?" active":""),
      style:{borderColor:isActive?w.color:"", background:isActive?w.color+"18":""},
      onClick:()=>{state.selWeek=i;render();}});
    pill.append(
      h("span",{className:"week-pill__num",style:{color:isActive?w.color:"var(--text-muted)"}},String(i+1)),
      h("div",{className:"week-pill__bar",style:{background:pr===100?"var(--green)":pr>0?w.color:"rgba(255,255,255,0.06)",opacity:pr===100?"1":pr>0?"0.6":"0.3"}})
    );
    grid.append(pill);
  });
  app.append(grid);

  // detail card
  const card = h("div",{className:"card card--accent",style:{"--accent":cw.color, borderLeftColor:cw.color}});

  const head = h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}});
  const left = h("div",null,
    h("div",{style:{fontSize:"11px",fontWeight:700,letterSpacing:"2px",color:cw.color,textTransform:"uppercase",marginBottom:"4px"}},`AY ${cw.month} · HAFTA ${cw.week} — ${cw.phase}`),
    h("h2",{style:{fontSize:"22px",fontWeight:700,color:"var(--text-primary)"}},cw.subject)
  );
  head.append(left, h("div",{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:"24px",fontWeight:700,color:cw.color}},`%${weekProg(state.selWeek)}`));
  card.append(head);

  // time badges
  const badges = h("div",{className:"time-badges"});
  badges.append(
    h("div",{className:"time-badge",innerHTML:`🕐 Hafta içi: günde <strong>${cw.dailyH} saat</strong>`}),
    h("div",{className:"time-badge",innerHTML:`📅 Hafta sonu: toplamda <strong>${cw.weekendH} saat</strong>`})
  );
  card.append(badges);

  // topics
  const wi = state.selWeek;
  cw.topics.forEach((t,ti) => {
    const done = !!state.done[wi+"-"+ti];
    const btn = h("div",{className:"topic-btn"+(done?" done":""), style:{background:done?cw.color+"10":"",borderColor:done?cw.color+"33":""},
      onClick:()=>toggleTopic(wi,ti)});
    btn.append(
      h("div",{className:"topic-btn__check",style:{background:done?cw.color:"transparent"}},done?"✓":""),
      h("span",{className:"topic-btn__text"},t)
    );
    card.append(btn);
  });

  // tip
  const tip = h("div",{className:"tip-box",style:{background:cw.color+"0A",border:`1px solid ${cw.color}22`}});
  tip.append(h("span",{style:{fontSize:"16px",flexShrink:0,marginTop:"1px"}},"💡"),
    h("span",{innerHTML:`<strong style="color:${cw.color}">İpucu:</strong> ${cw.tip}`}));
  card.append(tip);
  app.append(card);
}

function renderSubjects(app) {
  SUBJECTS.forEach(s => {
    const card = h("div",{className:"card card--accent subj-card",style:{"--accent":s.color, borderLeftColor:s.color}});
    const head = h("div",{className:"subj-card__head"});
    head.append(h("span",{className:"subj-card__icon"},s.icon),
      h("div",null,h("div",{className:"subj-card__name"},s.name),h("div",{className:"subj-card__meta"},`${s.q} soru · Minimum 50 puan`)));
    card.append(head);
    const tg = h("div",{className:"subj-topics"});
    s.subs.forEach(t => tg.append(h("div",{className:"subj-topic"},"• "+t)));
    card.append(tg);
    app.append(card);
  });

  // exam rules
  const rc = h("div",{className:"card",style:{background:"linear-gradient(135deg, rgba(78,130,200,0.1), rgba(22,27,34,0.95))",border:"1px solid rgba(78,130,200,0.2)"}});
  rc.append(h("h3",{style:{fontSize:"16px",fontWeight:700,color:"var(--text-primary)",marginBottom:"14px"}},"📋 Sınav Kuralları Özet"));
  const rg = h("div",{className:"rules-grid"});
  RULES.forEach(r => { rg.append(h("div",{className:"rule-box"},h("div",{className:"rule-box__label"},r.l),h("div",{className:"rule-box__val"},r.v))); });
  rc.append(rg);
  app.append(rc);
}

function renderResources(app) {
  RESOURCES.forEach(r => {
    const row = h("div",{className:"res-row"});
    row.append(h("div",null, h("div",{className:"res-row__name"},r.name), h("div",{className:"res-row__url"},r.url)),
      h("span",{className:"res-badge",style:{background:r.c+"22",color:r.c}},r.type));
    app.append(row);
  });

  // strategy
  const sc = h("div",{className:"card",style:{border:"1px solid rgba(232,168,56,0.15)"}});
  sc.append(h("h3",{style:{fontSize:"16px",fontWeight:700,color:"var(--text-primary)",marginBottom:"14px"}},"🎯 Çalışma Stratejisi"));
  STEPS.forEach((s,i) => {
    sc.append(h("div",{className:"step-row"},h("span",{className:"step-num"},String(i+1)),h("span",{className:"step-text"},s)));
  });
  app.append(sc);
}

// ─── INIT ──────────────────────────────────────────────
loadProgress();
render();
</script>

</body>
</html>
